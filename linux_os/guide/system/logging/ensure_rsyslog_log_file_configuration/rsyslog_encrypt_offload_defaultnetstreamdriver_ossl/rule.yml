documentation_complete: true

title: Ensure Rsyslog Encrypts Off-Loaded Audit Records Using OSSL Driver

description: |-
  Rsyslogd is a system utility providing support for message logging. Support
  for both internet and UNIX domain sockets enables this utility to support both local
  and remote logging. Couple this utility with OpenSSL (which is a secure communications
  library implementing the SSL and TLS protocols), and you have a method to securely
  encrypt and off-load auditing.

  When using <tt>rsyslogd</tt> to off-load logs off an encryption system must be used.

  Set the following configuration option in /etc/rsyslog.conf or in a file in /etc/rsyslog.d (using legacy syntax):
  <pre>$DefaultNetstreamDriver ossl</pre>

  Alternatively, use the RainerScript syntax:
  <pre>global(DefaultNetstreamDriver="ossl")</pre>

rationale: |-
    The audit records generated by Rsyslog contain valuable information regarding system
    configuration, user authentication, and other such information. Audit records should be
    protected from unauthorized access.

severity: medium

identifiers:
    cce@rhel8: CCE-85993-4
    cce@rhel9: CCE-86783-8
    cce@rhel10: CCE-89019-4

references:
    nist: AU-4(1)
    srg: SRG-OS-000479-GPOS-00224

ocil_clause: 'rsyslogd DefaultNetstreamDriver not set to ossl'

ocil: |-
    Verify the operating system encrypts audit records off-loaded onto a different system
    or media from the system being audited with the following commands:

    <pre>$ sudo grep -i '$DefaultNetstreamDriver' /etc/rsyslog.conf /etc/rsyslog.d/*.conf</pre>

    The output should be:

    <pre>/etc/rsyslog.conf:$DefaultNetstreamDriver ossl</pre>

fixtext: |-
    Configure the operating system to encrypt off-loaded audit records by setting the following options in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf":

    $DefaultNetstreamDriver ossl

srg_requirement: '{{{ full_name }}} must encrypt via the ossl driver the transfer of audit records off-loaded onto a different system or media from the system being audited via rsyslog.'